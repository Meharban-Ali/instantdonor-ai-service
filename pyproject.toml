# ============================================================
# pyproject.toml — Blood Donor AI Service
# Modern Python project configuration
#
# Replaces:
#   setup.py, setup.cfg, .flake8, .isort.cfg, pytest.ini
#
# Usage:
#   pip install -e .          → Development install
#   black .                   → Format code
#   isort .                   → Sort imports
#   mypy core/                → Type check
#   pytest                    → Run tests
#   flake8 .                  → Lint
# ============================================================


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 4: Build system — packaging ke liye
# ─────────────────────────────────────────────────────────
#
# Explanation:
# Modern Python packaging ke liye zaruri
# pip install -e . → development mode install
# setuptools → most compatible build backend
[build-system]
requires      = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 3: Project metadata
# ─────────────────────────────────────────────────────────
#
# Explanation:
# Project ki identity define karo
# PyPI publish, pip install ke liye
# requires-python → version constraint enforce
[project]
name            = "blood-donor-ai-service"
version         = "1.0.0"
description     = "AI-powered Blood Donor Matching + Demand Prediction"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.11"

# Project authors
[[project.authors]]
name  = "Blood Donor Network Team"
email = "dev@blooddonor.com"

# Project keywords — PyPI search ke liye
keywords = [
    "blood-donation",
    "ai-matching",
    "fastapi",
    "machine-learning",
]

# Project classifiers — PyPI categories
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 1 + 2: [tool.black] — URL encoding fix
# ─────────────────────────────────────────────────────────
#
# Explanation:
# Black → automatic code formatter
# line-length 88 → black default
# target-version → Python 3.11 syntax use karo
# skip-string-normalization → single quotes allow
[tool.black]
line-length               = 88
target-version            = ["py311"]
skip-string-normalization = false
include                   = '\\.pyi?$'
extend-exclude            = '''
/(
    \.git
  | \.venv
  | venv
  | alembic/versions
  | __pycache__
)/
'''


# ─────────────────────────────────────────────────────────
# isort — Import sorting
# ─────────────────────────────────────────────────────────
#
# Explanation:
# Import order:
# 1. stdlib (os, sys, math...)
# 2. third-party (fastapi, sqlalchemy...)
# 3. first-party (core, models, services...)
# 4. local (.relative imports)
[tool.isort]
profile     = "black"
line_length = 88

# ✅ Bug Fix 8: Correct first-party modules
known_first_party = [
    "core*",
    "models*",
    "services",
    "utils",
    "routes",
    "repositories",
    "scripts",
]
known_third_party = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "redis",
    "sklearn",
    "numpy",
    "pandas",
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
force_sort_within_sections = true
combine_as_imports         = true


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 5: mypy — Type checking (not too strict)
# ─────────────────────────────────────────────────────────
#
# Explanation:
# strict=true → FastAPI/SQLAlchemy ke saath too many errors
# Specific flags → meaningful errors only
# ignore_missing_imports → third-party stubs nahi hain
# Per-module overrides → noisy libraries quiet karo
[tool.mypy]
python_version        = "3.11"

# ✅ Bug Fix 5: strict=true hataya — specific flags
warn_return_any           = true
warn_unused_configs       = true
warn_unused_ignores       = true
warn_redundant_casts      = true
disallow_untyped_defs     = true
disallow_incomplete_defs  = true
check_untyped_defs        = true
no_implicit_optional      = true
strict_optional           = true

# Imports
ignore_missing_imports    = true
follow_imports            = "normal"

# Output
show_error_codes          = true
show_column_numbers       = true
pretty                    = true

# Exclude
exclude = [
    "tests/",
    "alembic/",
    "scripts/",
    "venv/",
    "\\.venv/",
]

# ✅ Per-module overrides — noisy libraries quiet karo
[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "sqlalchemy.*",
    "pydantic.*",
    "sklearn.*",
    "scipy.*",
    "redis.*",
    "jose.*",
    "passlib.*",
    "slowapi.*",
]
ignore_missing_imports    = true
ignore_errors             = false


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 7 + 10: pytest — Complete config
# ─────────────────────────────────────────────────────────
#
# Explanation:
# asyncio_mode=auto → async tests automatically handle
# markers → custom test categories define karo
# filterwarnings → known warnings suppress karo
# addopts → default options har pytest run pe
[tool.pytest.ini_options]
asyncio_mode  = "auto"
testpaths     = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ✅ Bug Fix 7: Coverage + short traceback
addopts = """
    --tb=short
    --strict-markers
    --no-header
    -ra
"""

# ✅ Bug Fix 10: Custom markers define karo
markers = [
    "unit: Unit tests — no external dependencies",
    "integration: Integration tests — DB/Redis needed",
    "slow: Slow tests — ML model loading etc.",
    "api: API endpoint tests",
    "db: Database tests",
]

# Warnings filter
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "error::UserWarning",
]


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 1: coverage.run — URL encoding fix
# ✅ Bug Fix 6: Correct source paths
# ─────────────────────────────────────────────────────────
#
# Explanation:
# source → kahan se coverage measure karo
# omit → ye files skip karo (tests, migrations)
# branch=true → branch coverage bhi measure karo
[tool.coverage.run]
source = [
    "core",         # Config, DB, Logging
    "models",       # Schemas, Enums
    "services",     # Business logic
    "utils",        # Distance, Scoring
    "routes",       # API endpoints
    "repositories", # DB queries
]

# ✅ Bug Fix 6: "app" remove kiya — exist nahi karta
omit = [
    "tests/*",
    "alembic/*",
    "scripts/*",
    "venv/*",
    ".venv/*",
    "*/__init__.py",
    "main.py",          # Entry point — test nahi
]

branch        = true   # Branch coverage bhi measure karo
parallel      = false
relative_files = true


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 1: coverage.report — URL encoding fix
# ─────────────────────────────────────────────────────────
#
# Explanation:
# fail_under=80 → 80% se kam coverage → CI fail
# show_missing → konsi lines cover nahi hain
# skip_covered → 100% covered files hide karo
[tool.coverage.report]
fail_under    = 80
show_missing  = true
skip_covered  = false
skip_empty    = true
sort          = "Miss"    # Most missing lines pehle
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",           # Ellipsis — Protocol methods
]


# ─────────────────────────────────────────────────────────
# HTML + XML coverage reports
# ─────────────────────────────────────────────────────────
[tool.coverage.html]
directory  = "htmlcov"
title      = "Blood Donor AI Service — Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"   # CI/CD ke liye


# ─────────────────────────────────────────────────────────
# ✅ Bug Fix 9: flake8 config
# ─────────────────────────────────────────────────────────
#
# Explanation:
# flake8 natively pyproject.toml support nahi karta
# lekin flake8-pyproject plugin ke saath kaam karta hai
# max-line-length → black ke saath consistent
# extend-ignore:
#   E203 → black ke saath conflict (whitespace before ':')
#   W503 → line break before binary operator
#   E501 → line too long (black handle karta hai)
[tool.flake8]
max-line-length  = 88
extend-ignore    = [
    "E203",   # Whitespace before ':' — black conflict
    "W503",   # Line break before binary operator
    "E501",   # Line too long — black handles this
    "F401",   # Imported but unused — mypy handles
]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "alembic/versions",
    "*.egg-info",
]
per-file-ignores = [
    "__init__.py:F401",   # __init__ mein re-exports ok
    "tests/*:S101",       # Tests mein assert ok
]
max-complexity = 10   # Cyclomatic complexity limit